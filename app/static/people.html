<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20120%20120%22%20width%3D%2230%22%20height%3D%2230%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20x%3D%2224%22%20y%3D%2256%22%20width%3D%2236%22%20height%3D%2248%22%20rx%3D%2216%22%20fill%3D%22%230B1E3F%22/%3E%3Crect%20x%3D%2260%22%20y%3D%2256%22%20width%3D%2236%22%20height%3D%2248%22%20rx%3D%2216%22%20fill%3D%22%230B1E3F%22/%3E%3Ccircle%20cx%3D%2242%22%20cy%3D%2236%22%20r%3D%2216%22%20fill%3D%22%232E63B0%22/%3E%3Ccircle%20cx%3D%2278%22%20cy%3D%2236%22%20r%3D%2216%22%20fill%3D%22%232E63B0%22/%3E%3Cpath%20d%3D%22M32%2066%20Q60%20102%2088%2076%22%20fill%3D%22none%22%20stroke%3D%22%235B86C6%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M88%2066%20Q60%2094%2032%2080%22%20fill%3D%22none%22%20stroke%3D%22%238FB0E0%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<title>TanysTap — люди</title>
<style>
  :root { --ink:#0B1E3F; --muted:#5A6B8C; --line:#DDE3EE; --acc2:#EAF0FA; --ok:#2E7D5B; --bad:#B42318; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink); background:#fff; }
  input, select, textarea { width:100%; min-width:0; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:15px; color:var(--ink); background:#fff; }
  input:focus, select:focus, textarea:focus { outline:2px solid #2E63B0; outline-offset:-1px; border-color:#2E63B0; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  .btn { display:block; width:100%; margin-top:20px; padding:13px; border:0; border-radius:10px; background:var(--ink); color:#fff; font-size:15px; font-weight:600; cursor:pointer; text-align:center; text-decoration:none; }
  .btn.ghost { background:var(--acc2); color:var(--ink); margin-top:10px; }
  .err { color:var(--bad); font-size:14px; margin-top:12px; min-height:20px; }
  @media (max-width:760px){ input, select, textarea { font-size:16px; } }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:17px; color:var(--ink); text-decoration:none; }
  main { max-width:640px; margin:0 auto; padding:18px 16px 40px; }
  h1 { font-size:20px; margin:4px 0; }
  .sub { color:var(--muted); font-size:13px; line-height:1.5; margin-bottom:12px; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px; }
  .chips a { white-space:nowrap; font-size:13px; padding:7px 12px; border:1px solid var(--line); border-radius:999px; color:var(--ink); text-decoration:none; }
  .chips a.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .p { display:flex; gap:12px; align-items:flex-start; padding:14px 6px; border-bottom:1px solid var(--line); }
  .av { width:52px; height:52px; border-radius:50%; overflow:hidden; background:var(--acc2); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:20px; flex:none; }
  .av img { width:100%; height:100%; object-fit:cover; }
  .b { flex:1; min-width:0; }
  .nm { font-weight:600; font-size:15px; }
  .rl { color:var(--muted); font-size:13px; }
  .sc { flex:none; text-align:right; font-size:11px; color:var(--muted); }
  .sc b { display:block; font-size:20px; color:var(--ink); }
  .acts { display:flex; gap:8px; margin-top:8px; }
  .acts a { font-size:13px; padding:7px 12px; border-radius:8px; border:1px solid var(--line); color:var(--ink); text-decoration:none; }
  .acts a.pri { background:var(--ink); color:#fff; border-color:var(--ink); }
  .empty { color:var(--muted); text-align:center; padding:50px 16px; line-height:1.6; }
</style>
</head>
<body>
<header><a class="brand" href="/app"><svg viewBox="0 0 120 120" width="28" height="28" aria-hidden="true"><rect x="24" y="56" width="36" height="48" rx="16" fill="#0B1E3F"/><rect x="60" y="56" width="36" height="48" rx="16" fill="#0B1E3F"/><circle cx="42" cy="36" r="16" fill="#2E63B0"/><circle cx="78" cy="36" r="16" fill="#2E63B0"/><path d="M32 66 Q60 102 88 76" fill="none" stroke="#5B86C6" stroke-width="12" stroke-linecap="round"/><path d="M88 66 Q60 94 32 80" fill="none" stroke="#8FB0E0" stroke-width="12" stroke-linecap="round"/></svg>TanysTap</a></header>
<main>
  <h1 id="title">Люди</h1>
  <div class="sub">Участники, которые сейчас открыты к общению. Отсортированы по совместимости с вами.</div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</main>
<script>
const sid = (() => { try { return localStorage.getItem("sid") || ""; } catch (e) { return ""; } })();
const goal = new URLSearchParams(location.search).get("goal") || "hire";
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
async function load() {
  const d = await fetch(`/api/people?session_id=${encodeURIComponent(sid)}&goal=${encodeURIComponent(goal)}`).then(r => r.json());
  document.getElementById("title").textContent = d.labels[goal] || "Люди";
  const chips = document.getElementById("chips");
  chips.replaceChildren(...Object.entries(d.labels).map(([k, v]) => { const a = el("a", k === goal ? "on" : "", `${v} · ${d.counts[k] || 0}`); a.href = "/people?goal=" + k; return a; }));
  const act = chips.querySelector(".on"); if (act) chips.scrollLeft = act.offsetLeft - 16;
  const list = document.getElementById("list");
  if (!d.people.length) { list.innerHTML = '<div class="empty">Пока здесь никого нет.<br>Загляните позже — участники регистрируются в течение всего мероприятия.</div>'; return; }
  list.replaceChildren(...d.people.map(p => {
    const row = el("div", "p"), av = el("div", "av");
    if (p.avatar) { const i = new Image(); i.src = p.avatar; i.alt = ""; av.appendChild(i); } else av.textContent = (p.name || "?").slice(0, 1);
    const b = el("div", "b");
    b.append(el("div", "nm", p.name), el("div", "rl", [p.role, p.company].filter(Boolean).join(" · ")));
    const acts = el("div", "acts");
    const pr = el("a", "pri", "Открыть профиль"); pr.href = "/p/" + encodeURIComponent(p.id) + "?from=list"; acts.append(pr);
    if (p.chat) { const ch = el("a", "", "Написать"); ch.href = "/chat/" + encodeURIComponent(p.id); acts.append(ch); }
    b.append(acts);
    const sc = el("div", "sc"); if (p.score != null) { sc.append(el("b", "", Math.round(p.score * 100) + "%")); sc.append(document.createTextNode("совместимость")); }
    row.append(av, b, sc);
    return row;
  }));
}
load();
</script>
<script src="/static/nav.js"></script>
</body>
</html>
